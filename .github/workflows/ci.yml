
name: NotesApp CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: notes
      DB_USER: notes_user
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}

    services:
      db:
        image: mariadb:11
        env:
          MARIADB_DATABASE: notes
          MARIADB_USER: notes_user
          MARIADB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Check repo
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Initialize database schema
        run: |
          mariadb -h 127.0.0.1 -P 3306 -u root -p"$DB_ROOT_PASSWORD" notes < init.sql

      - name: Check Python syntax
        run: python -m compileall -q app.py

      - name: Automated tests
        run: python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t notesapp:test .

  docker:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check repo
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/devops-noteapp:latest
            ${{ secrets.DOCKERHUB_USER }}/devops-noteapp:${{ github.sha }}
